apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: elastic-lab
  namespace: default
spec:
  version: 8.14.0
  count: 1
  elasticsearchRef:
    name: elastic-lab
  podTemplate:
    spec:
      containers:
      - name: kibana
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 500m
